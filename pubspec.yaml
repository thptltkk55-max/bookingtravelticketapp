name: doan_clean_achitec
description: A new Flutter project by clean achitec
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.5

  # State management / local storage
  get: 4.6.5
  shared_preferences: 2.2.0

  # UI / effect
  wave: 0.2.2
  fluttertoast: 8.2.2
  flutter_easyloading: 3.0.5
  font_awesome_flutter: 10.5.0
  smooth_page_indicator: 1.1.0
  like_button: 2.0.5
  salomon_bottom_bar: 3.3.2
  flutter_staggered_grid_view: 0.6.2
  carousel_slider: 4.2.1
  fl_chart: 0.63.0
  flutter_svg: 2.0.7
  rive: 0.11.17
  lottie: 2.3.2
  cached_network_image: 3.2.3
  flutter_speed_dial: 7.0.0
  adaptive_dialog: 1.9.0
  bottom_sheet: 4.0.0

  # QR code
  # Code hiện tại đang dùng PrettyQrDecoration / PrettyQrView,
  # nên không dùng pretty_qr_code 2.0.3 nữa.
  pretty_qr_code: 3.5.0

  # Image / media
  image_picker: 1.0.4
  wechat_assets_picker: 8.6.0
  photo_manager: 2.7.1
  image_gallery_saver: 2.0.3
  video_compress: 3.1.1
  video_player: 2.7.0

  # Firebase - phù hợp với Flutter 3.10.5 / Dart 3.0.5
  firebase_core: 2.15.1
  firebase_auth: 4.9.0
  firebase_messaging: 14.6.7
  firebase_database: 10.2.5
  firebase_storage: 11.2.6
  cloud_firestore: 4.9.1
  google_sign_in: 6.1.5

  # Form / input
  pinput: 3.0.1
  dropdown_button2: 2.3.9
  intl: 0.18.1
  syncfusion_flutter_datepicker: 22.2.12

  # Map / location
  google_maps_flutter: 2.5.0
  location: 5.0.3
  geolocator: 9.0.2
  geocoding: 2.1.1
  custom_map_markers: 0.0.2+1
  flutter_polyline_points: 2.0.0

  # Config / device / permission
  flutter_config: 2.0.2
  permission_handler: 10.4.3
  package_info_plus: 4.0.2

  # Utility
  uuid: 3.0.7
  url_launcher: 6.1.12
  http: 1.1.0
  share_plus: 7.2.2
  flutter_phone_direct_caller: 2.1.1
  flutter_local_notifications: 14.1.5
  timeago: 3.5.0
  weather: 3.1.1

  # Payment
  flutter_stripe: 9.2.2

  # Old package
  slideable: 0.0.2

dependency_overrides:
  # Tránh lỗi flutter_spinkit 5.2.2 dùng Color.withValues trên Flutter cũ.
  flutter_spinkit: 5.2.1

  # Tránh lỗi flutter_stripe 9.2.2 bị kéo stripe_platform_interface 9.5.0+1.
  # Nếu 9.3.0 không resolve được, đổi xuống 9.2.2.
  stripe_platform_interface: 9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/json/
    - assets/images/x2/
    - assets/images/x3/
    - assets/icons/
    - assets/icons/svg/
    - assets/icons/riv/
    - assets/videos/
    - assets/chatbot/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Light.ttf
        - asset: assets/fonts/montserrat/Montserrat-LightItalic.ttf
        - asset: assets/fonts/montserrat/Montserrat-Italic.ttf
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/montserrat/Montserrat-MediumItalic.ttf
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
        - asset: assets/fonts/montserrat/Montserrat-SemiBoldItalic.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
        - asset: assets/fonts/montserrat/Montserrat-BoldItalic.ttf
          style: italic
